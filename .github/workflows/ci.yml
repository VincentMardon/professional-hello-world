name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Retrieve the ceremonial materials
        uses: actions/checkout@v7

      - name: Prepare the JavaScript department
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the officially recorded dependencies
        run: npm ci

      - name: Inspect spelling-adjacent matters
        run: npm run check

      - name: Verify the types of our intentions
        run: npm run typecheck

      - name: Hear the sworn testimony of the greeting
        run: npm run test:run

      - name: Construct the disproportionately qualified greeting
        run: npm run build

      - name: Package the verified greeting
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  publish:
    needs: sanity
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml