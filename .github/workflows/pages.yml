name: Publish the Greeting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Retrieve the ceremonial materials
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare the public greeting
        run: |
          mkdir -p _site/docs/assets/images
          cp -R frontend/src/. _site/
          cp frontend/src/hello.html _site/index.html
          cp docs/assets/images/coding-cat.png _site/docs/assets/images/

      - name: Package the greeting
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Release the greeting into the world
        id: deployment
        uses: actions/deploy-pages@v5
