name: Publish the Greeting

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Retrieve the ceremonial materials
        uses: actions/checkout@v4

      - name: Prepare the JavaScript department
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install the officially recorded dependencies
        run: npm ci

      - name: Inspect spelling-adjacent matters
        run: npm run check

      - name: Verify the types of our intentions
        run: npm run typecheck

      - name: Construct the disproportionately qualified greeting
        run: npm run build

      - name: Package the greeting
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Release the greeting into the world
        id: deployment
        uses: actions/deploy-pages@v5
